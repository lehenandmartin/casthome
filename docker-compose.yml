services:
  casthome:
    # Released image (:latest is the last release). Pin a version for
    # controlled updates, e.g. :0.1 or :0.1.0; :main follows development.
    image: ghcr.io/lehenandmartin/casthome:latest
    container_name: casthome
    # Required: mDNS discovery of Cast devices does not cross Docker's bridge network.
    network_mode: host
    # Optional: settings are entered in the browser. Uncomment to use a .env.
    # env_file: .env
    # Optional settings (uncomment the block and the lines you need):
    # environment:
    #   # Port CastHome listens on (default 4577). With network_mode: host,
    #   # a "ports:" mapping is ignored: set the port here instead.
    #   PORT: "4577"
    #   # Owner of ./data on the host (the container fixes it at start).
    #   PUID: "1000"
    #   PGID: "1000"
    #   # Behind a reverse proxy: the address it connects from (see README).
    #   FORWARDED_ALLOW_IPS: "172.16.0.0/12"
    volumes:
      - ./data:/data
    restart: unless-stopped
